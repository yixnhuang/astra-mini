<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="project-title project-desc">
  <title id="project-title">Project preview placeholder</title>
  <desc id="project-desc">A neutral frame standing in for a project screenshot or figure.</desc>
  <style>
    :root {
      --surface: #f5f5f7;
      --hairline: rgba(29, 29, 31, 0.10);
      --mark: #8e8e93;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #2c2c2e;
        --hairline: rgba(255, 255, 255, 0.12);
        --mark: #6c6c70;
      }
    }
    .surface { fill: var(--surface); }
    .hairline { fill: none; stroke: var(--hairline); stroke-width: 3; }
    /* opacity on the group, never fill-opacity on each shape: per-shape opacity
       makes every shared edge show as a pale hairline and every overlap darken. */
    .mark { fill: var(--mark); opacity: 0.45; }
  </style>

  <!-- Corners are intentionally square: the template applies border-radius in CSS. -->
  <rect class="surface" width="960" height="540"/>

  <!-- Mark bounds x 241..719 and y 135..405: 478 x 270, centred on 480,270.
       Sized so that it fills about half its tile, matching the other two
       placeholders — they have to read as one set. -->
  <g class="mark">
    <path d="M241 405 389 228l99 103 65-61 166 135Z"/>
    <circle cx="660" cy="177" r="42"/>
  </g>

  <rect class="hairline" x="1.5" y="1.5" width="957" height="537"/>
</svg>
